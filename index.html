<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alinyfilm.co | filmmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #892F1A;   /* Cor Terracota */
            --secondary: #D2C8BE; /* Bege (detalhes) */
            --bg: #FDFAF5;        /* Cor do Fundo */
        }

        * { 
            margin: 0;           /* Remove espaços externos padrão do navegador */
            padding: 0;          /* Remove espaços internos padrão do navegador */
            box-sizing: border-box; /* Garante que padding e bordas não aumentem o tamanho total do elemento */
            cursor: none !important; /* Esconde a seta do mouse */
        }

        body { 
            background-color: var(--bg); 
            font-family: 'Questrial', sans-serif; 
            overflow: hidden;    /* Trava a tela para não ter barra de rolagem no desktop */
            color: var(--primary); 
        }

        /* --- CURSOR --- */
        #cursor {
            position: fixed;     /* Fixa o sol na tela, independente de onde você estiver */
            width: 40px;         /* Largura do sol */
            height: 40px;        /* Altura do sol */
            z-index: 10000;      /* Camada: garante que ele fique por cima de TUDO */
            transform: translate(-50%, -50%); /* Ajusta o centro do sol exatamente no bico do mouse */
            pointer-events: none; /* Faz o sol ser "fantasma", permitindo clicar no que está atrás dele */
        }

        /* --- HEADER --- */
        header {
            position: fixed;     /* Mantém o topo sempre visível */
            top: 0;              /* Cola no topo */
            width: 100%;         /* Ocupa a largura total da tela */
            padding: 20px 40px;  /* Espaçamento interno: 20px em cima/baixo, 40px nas laterais */
            display: flex;       /* Ativa o modo de alinhamento flexível */
            justify-content: flex-start; /* Alinha o logo e o texto à esquerda */
            align-items: center; /* Centraliza verticalmente o logo e o texto */
            gap: 40px;           /* Distância entre o logo e a palavra "filmmaker" */
            z-index: 100;
        }
        
        .logo-img {
            height: 140px;       /* Controla o tamanho do seu logo */
            width: auto;         /* Mantém a proporção da imagem sem achatar */
            object-fit: contain; /* Garante que a imagem caiba no espaço sem cortes */
        }

        /* --- ESTRUTURA DOS CARDS (MAIN) --- */
        main {
            display: flex;       /* Coloca os cards um ao lado do outro */
            width: 100vw;        /* Largura total da janela (Viewport Width) */
            height: 100vh;       /* Altura total da janela (Viewport Height) */
            padding: 140px 40px 80px 40px; /* Margens internas para os cards não baterem nas bordas */
            gap: 15px;           /* Espaço (fresta) entre cada card */
        }

        .living-frame {
            position: relative;  /* Permite que o conteúdo interno (vídeo/texto) se alinhe a ele */
            flex: 1;             /* Faz todos os cards terem o mesmo tamanho inicial */
            height: 100%;        /* Estica o card até o limite do padding do 'main' */
            border-radius: 15px; /* Arredonda as quinas dos cards */
            overflow: hidden;    /* Esconde qualquer conteúdo que tente sair do card */
            transition: flex 0.8s cubic-bezier(0.25, 1, 0.5, 1); /* Suaviza a abertura do card */
            display: flex;
            align-items: flex-end; /* Coloca os textos na parte de baixo do card */
        }

        .living-frame:hover { 
            flex: 5;             /* Quando o mouse entra, o card cresce 5x em relação aos outros */
        }

        .living-frame video, .living-frame img {
            position: absolute;  /* Solta a imagem/vídeo para flutuar dentro do card */
            top: 0; left: 0;
            width: 100%;         /* Faz a mídia preencher toda a largura do card */
            height: 100%;        /* Faz a mídia preencher toda a altura do card */
            object-fit: cover;   /* Corta a imagem/vídeo para preencher o espaço sem distorcer */
            filter: brightness(0.7); /* Deixa a imagem um pouco mais escura para o texto aparecer */
        }

        /* --- CONTEÚDO DENTRO DO CARD --- */
        .frame-content {
            position: relative;
            padding: 40px;       /* Distância do texto para a borda do card */
            width: 100%;         /* Garante que o container do texto ocupe o card todo */
            opacity: 0;          /* Deixa o texto invisível por padrão */
            transform: translateY(20px); /* Move o texto um pouco para baixo (para o efeito de subida) */
            transition: 0.5s 0.3s; /* 0.5s de duração e 0.3s de espera para começar */
        }

        .living-frame:hover .frame-content { 
            opacity: 1;          /* Revela o texto no hover */
            transform: translateY(0); /* Faz o texto subir para a posição original */
        }

        /* --- BOTÃO FLUTUANTE (CTA) --- */
        .cta-float {
            position: fixed;     /* Fixa o botão no canto da tela */
            bottom: 40px;        /* Distância do fundo */
            right: 40px;         /* Distância da direita */
            padding: 15px 35px;  /* Tamanho interno do botão */
            border-radius: 50px; /* Deixa o botão com formato de pílula */
            background: var(--primary); /* Cor de fundo (Terracota) */
            color: var(--bg);    /* Cor da letra (Marfim) */
            text-decoration: none; /* Remove o sublinhado de link */
            letter-spacing: 2px; /* Aumenta o espaço entre as letras */
            font-size: 0.8rem;   /* Tamanho da fonte */
            z-index: 200;
        }
    </style>
</head>
<body>
    </body>
</html>
